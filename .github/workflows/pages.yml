name: Publish textbook
on: workflow_dispatch
permissions: {}
concurrency:
  group: textbook-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/codex/textbook-bootstrap'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Render with Quarto 1.11.9
        run: |
          curl -fsSL --retry 3 https://github.com/quarto-dev/quarto-cli/releases/download/v1.11.9/quarto-1.11.9-linux-amd64.tar.gz -o "$RUNNER_TEMP/quarto.tgz"
          echo "9d037baa3b38ffac7217edca1d2e53760b0fab4d5749220740a32056e03a1530  $RUNNER_TEMP/quarto.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/quarto.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/quarto-1.11.9/bin/quarto" render
          python3 scripts/check_release.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _book
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
