<script>
const find=id=>document.getElementById(id);
find('zoom').onclick=function(){const on=this.getAttribute('aria-pressed')==='false';document.querySelector('.slide').style.width=on?'200%':'100%';this.setAttribute('aria-pressed',on);};
if(find('next')){
 let step=0;
 function show(n){step=n;find('appears').style.visibility=n?'visible':'hidden';const layer=find('exits');layer.style.transition=n===2&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'transform .5s linear':'none';layer.style.transform=n===2?'translateY(100%)':'none';find('prev').disabled=n===0;find('next').disabled=n===2;}
 find('next').onclick=()=>show(step+1);find('prev').onclick=()=>show(step-1);find('reset').onclick=()=>show(0);show(0);
}
if(find('video'))find('video').onclick=function(){const f=document.createElement('iframe');f.title='YouTube';f.allow='autoplay; fullscreen';f.src='https://www.youtube-nocookie.com/embed/'+this.dataset.id+'?autoplay=1';this.replaceWith(f);};
</script>
